<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoShare - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">

    <section class="login-card">

      <div class="brand">PhotoShare</div>

      <form id="bookingForm">

        <input
          type="text"
          id="email"
          placeholder="Phone number, username, or email"
          autocomplete="off"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="off"
          required
        >

        <button type="submit" class="login-btn">
          Log in
        </button>

      </form>

      <div class="divider">
        <span></span>
        <p>OR</p>
        <span></span>
      </div>

      <button class="facebook-btn" type="button">
        <span class="facebook-icon">f</span>
        Log in with Facebook
      </button>

      <a href="#" class="forgot">
        Forgot password?
      </a>

    </section>

    <section class="signup-card">
      <span>Don't have an account?</span>
      <a href="#">Sign up</a>
    </section>

    <p class="download-title">Get the app.</p>

    <div class="store-buttons">
      <button type="button">Google Play</button>
      <button type="button">App Store</button>
    </div>

    <footer>
      <p>© 2026 PhotoShare · Demo interface</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
